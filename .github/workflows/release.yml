name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
            Write-Error "Tag '$tag' must match v<major>.<minor>.<patch>[.<build>]."
            exit 1
          }
          $version = $tag.Substring(1)
          if (($version -split '\.').Count -eq 4) {
            $assemblyVersion = $version
          } else {
            $assemblyVersion = "$version.0"
          }
          "VERSION=$version" | Add-Content -Path $env:GITHUB_ENV
          "ASSEMBLYVERSION=$assemblyVersion" | Add-Content -Path $env:GITHUB_ENV
          "ARTIFACT_AOT=TextCascade-AOT.exe" | Add-Content -Path $env:GITHUB_ENV
          "ARTIFACT_AOT_UPX=TextCascade-AOT-UPX.exe" | Add-Content -Path $env:GITHUB_ENV
          "ARTIFACT_NO_RUNTIME=TextCascade-Without-Runtime.exe" | Add-Content -Path $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: |
          $version = $env:VERSION
          $assemblyVersion = $env:ASSEMBLYVERSION
          dotnet build TextCascadeSharp.csproj -c Release --warnaserror `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version
          dotnet test tests\TextCascadeSharp.Tests\TextCascadeSharp.Tests.csproj -c Release

      - name: Publish NativeAOT (Self-Contained)
        shell: pwsh
        run: |
          $version = $env:VERSION
          $assemblyVersion = $env:ASSEMBLYVERSION
          dotnet publish TextCascadeSharp.csproj -c Release -o publish-aot `
            -p:PublishAot=true `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version
          # 保留未压缩的 AOT 产物：体积约为 UPX 版的两倍，但启动时无需解压到内存，
          # 私有内存可低约 14MB。两种都发布由用户按需选择。
          Copy-Item -Path publish-aot\TextCascade.exe -Destination $env:ARTIFACT_AOT

      - name: Compress NativeAOT with UPX
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          # 在副本上压缩，保留上一步的未压缩产物
          Copy-Item -Path publish-aot\TextCascade.exe -Destination $env:ARTIFACT_AOT_UPX
          upx --best --lzma $env:ARTIFACT_AOT_UPX

      - name: Publish Framework-Dependent (Without-Runtime)
        shell: pwsh
        run: |
          $version = $env:VERSION
          $assemblyVersion = $env:ASSEMBLYVERSION
          dotnet publish TextCascadeSharp.csproj -c Release -o publish-no-runtime `
            -p:PublishAot=false `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version
          Copy-Item -Path publish-no-runtime\TextCascade.exe -Destination $env:ARTIFACT_NO_RUNTIME

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --generate-notes $env:ARTIFACT_AOT $env:ARTIFACT_AOT_UPX $env:ARTIFACT_NO_RUNTIME
